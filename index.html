<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excellence Program — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { min-height: 100dvh; }

  body {
    font: 400 14px/1.5 "Inter", system-ui, sans-serif;
    color: #1f2937;
    background: #ffffff;
    -webkit-font-smoothing: antialiased;
  }

  .split {
    display: flex;
    min-height: 100dvh;
  }

  /* ---------- Left (brand) panel ---------- */

  .brand {
    flex: 1.15 1 54%;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    margin: clamp(10px, 1.4vh, 16px);
    border-radius: 28px;
    box-shadow: 0 18px 44px rgba(12, 84, 70, 0.16);
    background:
      radial-gradient(560px 440px at 88% 2%, rgba(252, 211, 77, 0.10), transparent 62%),
      radial-gradient(320px 260px at 84% 10%, rgba(240, 180, 84, 0.07), transparent 60%),
      radial-gradient(900px 680px at 14% 84%, rgba(45, 212, 168, 0.16), transparent 60%),
      radial-gradient(640px 520px at 52% 40%, rgba(20, 184, 166, 0.08), transparent 65%),
      linear-gradient(135deg, #0a3029 0%, #0d4a41 52%, #10756a 100%);
    padding: clamp(22px, 4.5vh, 44px) clamp(26px, 5vw, 72px);
    overflow: hidden;
  }

  .brand::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(640px at 22% 74%, rgba(94, 234, 212, 0.10), transparent 70%);
    animation: breathe 7s ease-in-out infinite alternate;
    pointer-events: none;
  }

  .brand-lockup {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-logo {
    height: 32px;
    width: auto;
    display: block;
  }

  .gem {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    background: #34d399;
    transform: rotate(45deg);
  }

  .brand-program {
    font: 600 12px/1.2 "Inter", sans-serif;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: rgba(214, 244, 236, 0.85);
    white-space: nowrap;
  }

  .brand-center {
    position: relative;
    max-width: 520px;
    padding: 32px 0;
  }

  .brand-headline {
    font: 700 clamp(30px, 2.6vw + 12px, 48px)/1.12 "Inter", sans-serif;
    letter-spacing: -0.025em;
    color: #f2fbf8;
  }

  .brand-line {
    margin-top: 18px;
    font-size: 16px;
    line-height: 1.55;
    color: rgba(222, 246, 240, 0.80);
    max-width: 44ch;
  }

  .brand-footer {
    position: relative;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.55);
  }

  /* entrance animation — one orchestrated load, then still */
  .rise {
    opacity: 0;
    transform: translateY(14px);
    animation: rise .65s cubic-bezier(.22,.8,.36,1) forwards;
  }
  .rise-1 { animation-delay: .05s; }
  .rise-2 { animation-delay: .18s; }
  .rise-3 { animation-delay: .30s; }
  .rise-4 { animation-delay: .42s; }

  /* ---------- Right (login) panel ---------- */

  .auth {
    flex: 1 1 46%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: clamp(20px, 4vh, 40px) clamp(24px, 4vw, 56px);
  }

  .auth-inner {
    width: 100%;
    max-width: 360px;
    text-align: left;
  }

  .auth h2 {
    font: 600 20px/1.3 "Inter", sans-serif;
    letter-spacing: -0.01em;
    color: #111827;
  }

  .auth-support {
    margin-top: 6px;
    font-size: 14px;
    color: #6b7280;
  }

  .accent {
    background: linear-gradient(100deg, #5eead4, #86efac);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .or-rule {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 20px 0 2px;
    font-size: 12px;
    color: #8fa3a0;
  }
  .or-rule::before, .or-rule::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #dfe7e4;
  }

  .field { margin-top: 12px; }
  .field label {
    display: block;
    font: 500 12.5px/1.2 "Inter", sans-serif;
    color: #44605a;
    margin-bottom: 6px;
    text-align: left;
  }
  .field input {
    width: 100%;
    padding: 12px 14px;
    font: 400 14px/1.4 "Inter", sans-serif;
    color: #111827;
    background: #ffffff;
    border: 1px solid #dfe4e2;
    border-radius: 10px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field input::placeholder { color: #9ca3af; }
  .field input:focus {
    border-color: #0d9488;
    box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.14);
  }

  .forgot {
    display: flex;
    justify-content: flex-end;
    margin-top: 9px;
    font-size: 12.5px;
  }
  .forgot a { color: #0f766e; font-weight: 500; text-decoration: none; }
  .forgot a:hover { text-decoration: underline; }
  .forgot a:focus-visible { outline: 2px solid #0d9488; outline-offset: 2px; }

  .signin-btn {
    margin-top: 16px;
    width: 100%;
    padding: 12px 16px;
    font: 500 14px/1.4 "Inter", sans-serif;
    color: #ffffff;
    background: #0d9488;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .signin-btn:hover {
    background: #0f766e;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(13, 148, 136, 0.25);
  }
  .signin-btn:active { transform: translateY(0); background: #115e59; }
  .signin-btn:focus-visible { outline: 2px solid #0d9488; outline-offset: 2px; }

  .sso {
    margin-top: 26px;
    width: 100%;
    padding: 13px 16px;
    font: 500 15px/1.4 "Inter", sans-serif;
    color: #ffffff;
    background: #0d9488;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .sso:hover {
    background: #0f766e;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(13, 148, 136, 0.25);
  }
  .sso:active { transform: translateY(0); }

  .sso:focus-visible {
    outline: 2px solid #0f766e;
    outline-offset: 2px;
  }

  .help {
    margin-top: 18px;
    font-size: 13px;
    color: #6b7280;
    text-align: center;
  }

  .help a {
    color: #0f766e;
    font-weight: 500;
    text-decoration: none;
  }

  .help a:hover { text-decoration: underline; }

  .help a:focus-visible {
    outline: 2px solid #0d9488;
    outline-offset: 2px;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes breathe {
    from { opacity: .7; transform: scale(1); }
    to   { opacity: 1;  transform: scale(1.06); }
  }

  @media (prefers-reduced-motion: reduce) {
    .sso, .brand::before { transition: none; animation: none; }
    .rise { opacity: 1; transform: none; animation: none; }
  }

  /* ---------- Mobile: stack, brand first ---------- */

  @media (max-width: 720px) {
    .split { flex-direction: column; }
    .brand {
      min-height: auto;
    }
    .brand-center { padding: 44px 0; max-width: none; }
    .auth { padding: 48px 24px; }
    .brand-program { display: none; }
  }
</style>
</head>
<body>
<main class="split">
  <section class="brand">
    <div class="brand-lockup rise rise-1">
      <img class="brand-logo" src="assets/emids-logo-dark.svg" alt="Emids">
      <span class="gem" aria-hidden="true"></span>
      <span class="brand-program">Excellence Program</span>
    </div>
    <div class="brand-center">
      <h1 class="brand-headline rise rise-2">Recognize <span class="accent">great work</span> every day.</h1>
      <p class="brand-line rise rise-3">Celebrate a teammate's win, spotlight excellence and redeem rewards — all in one place.</p>
    </div>
    <footer class="brand-footer rise rise-4">&copy; Emids</footer>
  </section>

  <section class="auth">
    <div class="auth-inner rise rise-3">
      <h2>Sign in</h2>
      <p class="auth-support">Sign in with your Emids work account.</p>
      <button class="sso" type="button">Continue with Emids SSO</button>
      <div class="or-rule" role="presentation">or continue with email</div>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-email">Work email</label>
          <input id="login-email" type="email" inputmode="email" autocomplete="email" placeholder="you@emids.com">
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password" placeholder="Enter your password">
        </div>
        <div class="forgot"><a href="#forgot">Forgot password?</a></div>
        <button class="signin-btn" type="submit">Sign in</button>
      </form>
      <p class="help">Need help? <a href="#helpdesk">Contact IT</a></p>
    </div>
  </section>
</main>
</body>
</html>
